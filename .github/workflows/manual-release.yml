name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update (leave empty to use v<projectVersion>)"
        required: false
        default: ""
      release_name:
        description: "Release title (leave empty to use the tag)"
        required: false
        default: ""
      draft:
        description: "Keep the release as a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  jar:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stage runnable JAR
        run: ./gradlew :lwjgl3:stageReleaseJar --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: lwjgl3/build/release/jar/*.jar
          if-no-files-found: error

  native:
    name: Build native package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: :lwjgl3:stageReleaseLinux
            artifact: linux-x64
          - os: windows-latest
            task: :lwjgl3:stageReleaseWindows
            artifact: windows-x64
          - os: macos-13
            task: :lwjgl3:stageReleaseMacX64
            artifact: macos-x64
          - os: macos-14
            task: :lwjgl3:stageReleaseMacM1
            artifact: macos-arm64
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stage native release bundle
        run: ./gradlew ${{ matrix.task }} --no-daemon

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: lwjgl3/build/release/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [jar, native]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve tag and title
        id: meta
        shell: bash
        run: |
          version="$(grep '^projectVersion=' gradle.properties | cut -d= -f2)"
          tag_name="${{ inputs.tag_name }}"
          if [ -z "$tag_name" ]; then
            tag_name="v${version}"
          fi

          release_name="${{ inputs.release_name }}"
          if [ -z "$release_name" ]; then
            release_name="$tag_name"
          fi

          if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
            git tag "$tag_name" "$GITHUB_SHA"
            git push origin "$tag_name"
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ inputs.draft }}
          files: |
            release-assets/**/*.jar
            release-assets/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

